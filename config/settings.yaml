# Seule source de configuration du pipeline. Aucune date en dur.

paths:
  raw: data/raw
  external: data/external
  processed: data/processed
  template: templates/outil_pharma.xlsx
  output: output/Analyse_Pharma.xlsx
  figures: output/figures

raw_files:
  hourly: Pharma_Ventes_Hourly.csv
  daily: Pharma_Ventes_Daily.csv
  weekly: Pharma_Ventes_Weekly.csv
  monthly: Pharma_Ventes_Monthly.csv

date_formats:
  hourly: "%m/%d/%Y %H:%M"
  daily: "%m/%d/%Y"
  weekly: "%m/%d/%Y"
  monthly: "%Y-%m-%d"

atc_groups: [M01AB, M01AE, N02BA, N02BE, N05B, N05C, R03, R06]

quality:
  reconciliation_tolerance: 0.01   # écart relatif toléré
  incomplete_month_ratio: 0.9      # part minimale de jours pour un mois complet

forecast:
  horizon: 1
  backtest_months: 24
  seasonal_period: 12
  service_level_z: 1.65            # niveau de service 95 % (loi normale, unilatéral)
  lead_time_months: 1              # délai de réapprovisionnement couvert par le stock de sécurité
  verdict_min_gain: 0.05           # « oui » si le modèle bat la meilleure baseline d'au moins 5 % de MAE

external:
  timeout: 30                      # secondes, téléchargement d'un cache absent
  figure_atc: [N02BE, R03]         # groupes illustrés face à la grippe (viz/plots.py)
  sources:
    # Réseau Sentinelles (Inserm, Sorbonne Université) : incidence hebdomadaire des
    # syndromes grippaux pour 100 000 habitants, France entière. Date de génération
    # du fichier : 1ʳᵉ ligne du cache. Rafraîchir : load_external(..., refresh=True).
    sentinelles:
      url: https://www.sentiweb.fr/datasets/all/inc-3-PAY.csv
      file: sentinelles_grippe.csv
